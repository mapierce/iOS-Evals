# Reproducibility contract. Every input that can move a score lives here.
# A stranger with this file and the same Xcode reproduces the published table.

[toolchain]
# Build number, not marketing version — two Xcodes both called "26.6" can ship
# different Swift compilers, and the compiler is our scorer.
xcode_build      = "17F113"
xcode_version    = "26.6"
swift_version    = "6.3.3"

[sdk]
platform    = "iphoneos"
sdk_version = "26.5"

# SwiftUI is split across two frameworks as of SDK 26.x. Both must be parsed or
# ground truth silently misses ~160 deprecated symbols (foregroundColor lives in
# SwiftUICore, not SwiftUI).
modules = ["SwiftUI", "SwiftUICore"]

# Interface slice to parse. arm64e is the only iOS slice shipped in the SDK.
interface_arch = "arm64e-apple-ios"

[target]
# The oldest iOS we promise to support — the FLOOR, not the ceiling.
# This alone defines what counts as an availability violation.
# Parameterised everywhere — never hardcode it.
#
# 17.0 sits three majors below the SDK ceiling (26.5), leaving 2,279 SwiftUI
# symbols above the line. Widest availability signal of the options considered
# (18.0 gives 839; 26.0 gives 26 and collapses the metric). Counts measured
# against the ground truth artifact, not estimated.
deployment_target = "17.0"

[generation]
temperature        = 0.2
samples_per_prompt = 5

# Output ceiling per request. LOAD-BEARING and deliberately generous.
# On models with thinking enabled, max_tokens caps thinking AND response text
# together. At 2000 the shakedown saw Claude Opus 5 spend the entire budget on
# thinking and return finish_reason=length with an empty body — which would
# have scored thinking models as failures while non-thinking models scored
# normally. That is a confound, not a glitch: it penalises a model for
# reasoning rather than for emitting stale APIs.
max_tokens = 16000

# Gateway concurrency. New accounts carry low per-model RPM limits; 12 workers
# tripped 429s on claude-opus-5 within a minute. Retries honour Retry-After.
workers = 4

# Raised from 12000 after a shakedown found kimi-k3 hitting the ceiling exactly
# and returning PARTIAL Swift — which compiles as a failure and would have been
# charged to the model rather than to the harness. Samples that stop on
# finish_reason=length are now flagged `truncated` and reported, so a run can
# never silently attribute our ceiling to a model's currency.
#
# A sample that still truncates is retried ONCE at double the ceiling, capped
# here. That separates the two cases automatically: completing on retry means
# the ceiling was ours, truncating again at 32000 is the model's own behaviour
# and is recorded as a genuine failure. Only truncating samples pay for a
# retry, and each sample records the ceiling it actually used.
max_tokens_ceiling = 32000

[compile]
# Cross-compile the scaffold to iOS. SwiftPM leaks the macOS sysroot to clang,
# so -Xcc -isysroot is required in addition to -Xswiftc -sdk or the build fails
# with "cannot load underlying module for 'UIKit'".
arch = "arm64-apple-ios"

# LOAD-BEARING. Apple marks most SwiftUI deprecations with the sentinel
# `deprecated: 100000.0` ("soft-deprecated"), which the compiler deliberately
# does NOT warn about — 270 of 326 deprecated symbols, including NavigationView,
# foregroundColor and accessibility(label:). Without this flag the benchmark
# silently observes only 47/326 = 14% of deprecations and every model looks
# current. Verified against Swift 6.3.3; it is a hidden flag, so re-verify if
# the toolchain pin moves.
warn_soft_deprecated = true

# Deprecation warnings carry this diagnostic group; availability failures are
# hard errors. Both are captured from the build.
deprecation_group = "DeprecatedDeclaration"

[gateway]
# Single endpoint for every model, so all generation runs one identical code
# path. Per-provider SDKs would add a per-provider confound to a benchmark
# whose entire purpose is controlling confounds.
provider  = "openrouter"
base_url  = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"   # read from env/.env; never stored here

# NEVER pin an id carrying OpenRouter's "~" prefix (e.g. ~moonshotai/kimi-latest).
# Those are floating aliases that re-point to new models over time, which
# silently breaks reproducibility — the pin would name a moving target.

[models]
# Verified live against the gateway's /models endpoint at pin time, not
# recalled. Prices are USD per million tokens, recorded as of 2026-08-19 for
# the results record; they drift and are not re-read at run time.
roster = [
  "anthropic/claude-opus-5",       # 5.00 / 25.00
  "anthropic/claude-sonnet-5",     # 2.00 / 10.00
  "openai/gpt-5.5",                # 5.00 / 30.00
  "openai/gpt-5.6-luna-pro",       # 0.20 /  1.20  — see note below
  "openai/gpt-5.6-sol-pro",        # 2.50 / 15.00
  "openai/gpt-5.6-terra-pro",      # 2.00 / 12.00
  "google/gemini-3.7-flash",       # 0.38 /  1.88
  "qwen/qwen3.8-27b",              # 0.45 /  3.20
  "deepseek/deepseek-v4-pro",      # 1.44 /  2.88
  "moonshotai/kimi-k3",            # 3.00 / 15.00
  "z-ai/glm-5.3",                  # 1.40 /  4.40
  "x-ai/grok-4.20",                # 1.25 /  2.50
  "mistralai/mistral-large-2512",  # 0.50 /  1.50
  "meta-llama/llama-4-maverick",   # 0.20 /  0.80
  "qwen/qwen3-coder-plus",         # 0.65 /  3.25  — code-specialised pair, see below
  "mistralai/codestral-2508",      # 0.30 /  0.90  — code-specialised pair, see below
]

# Two code-specialised models sit alongside general-purpose siblings from the
# same labs (qwen3.8-27b, mistral-large-2512). That pairing is deliberate: it
# tests whether coding-tuned training makes a model more API-current, or just
# more fluent in stale idioms. Read those four together, not in isolation.

# gpt-5.6-luna-pro is priced ~12x below sol-pro and terra-pro despite the
# shared "-pro" suffix. Treat it as a lower tier when reading results; the
# three are not peers.

# Open-weight entries whose backend provider can vary per request. The gateway
# may route these across hosts serving different quantisations and fail over
# silently, which would violate the recorded-quantisation invariant. Generation
# must disable fallbacks and record the serving provider on every sample.
routing_sensitive = ["qwen/qwen3.8-27b", "deepseek/deepseek-v4-pro",
                     "moonshotai/kimi-k3", "z-ai/glm-5.3",
                     "meta-llama/llama-4-maverick"]
